{% extends "layout.html" %}
{% block content %}
<h2>Edit Game Stats</h2>
<form action="{{ url_for('edit_game', game_id=game['id']) }}" method="POST">
    <label for="game_date">Game Date:</label>
    <input type="date" id="game_date" name="game_date" value="{{ game['game_date'] }}" required>

    <label for="points">Points:</label>
    <input type="number" id="points" name="points" value="{{ game['points'] }}" required>

    <label for="assists">Assists:</label>
    <input type="number" id="assists" name="assists" value="{{ game['assists'] }}" required>

    <label for="rebounds">Rebounds:</label>
    <input type="number" id="rebounds" name="rebounds" value="{{ game['rebounds'] }}" required>

    <label for="steals">Steals:</label>
    <input type="number" id="steals" name="steals" value="{{ game['steals'] }}" required>

    <label for="blocks">Blocks:</label>
    <input type="number" id="blocks" name="blocks" value="{{ game['blocks'] }}" required>

    <label for="turnovers">Turnovers:</label>
    <input type="number" id="turnovers" name="turnovers" value="{{ game['turnovers'] }}" required>

    <button type="submit">Save Changes</button>
</form>
{% endblock %}
