{% extends "layout.html" %}
{% block content %}
<h2>Players</h2>
<ul>
    {% for player in players %}
    <li>
        {{ player["team_name"] }} - {{ player["player_name"] }}
        <a href="{{ url_for('view_player', player_id=player['id']) }}">View Stats</a>
        <!-- Link to view player details, if applicable -->
        <!-- Delete button (POST form) -->
        <form action="{{ url_for('delete_player', player_id=player['id']) }}" method="POST" style="display:inline;">
            <button type="submit" onclick="return confirm('Are you sure you want to delete this player?')">
                Delete Player
            </button>
        </form>
    </li>
    {% endfor %}
</ul>
{% endblock %}
